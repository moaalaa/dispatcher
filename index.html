<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dispatcher — layout idea (Tailwind)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* small bits Tailwind utilities can't express directly */
  .pin-driver{
    width:0;height:0;
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-bottom:16px solid #3ecf8e;
    filter:drop-shadow(0 0 4px rgba(62,207,142,.6));
  }
  .pin-driver.busy{border-bottom-color:#f0b23c;filter:drop-shadow(0 0 4px rgba(240,178,60,.6));}
  .pin-driver.invited{border-bottom-color:#b47bf0;filter:drop-shadow(0 0 4px rgba(180,123,240,.6));}
  .pin-trip{
    width:16px;height:16px;
    border-radius:50% 50% 50% 0;
    background:#4fb0ff;
    transform:translate(-50%,-100%) rotate(-45deg);
    filter:drop-shadow(0 0 4px rgba(79,176,255,.6));
  }
  .pin-trip.focused{ background:#fff; filter:drop-shadow(0 0 8px rgba(255,255,255,.9)); }
  .ring{
    border:1.5px dashed #4fb0ff;
    border-radius:50%;
    transform:translate(-50%,-50%);
    opacity:.55;
  }
  .map-grid{
    background-image:
      linear-gradient(#2a3a48 1px, transparent 1px),
      linear-gradient(90deg, #2a3a48 1px, transparent 1px);
    background-size:40px 40px;
  }
</style>
</head>
<body class="bg-slate-950 text-slate-100 text-sm">

<!-- top bar -->
<div class="flex items-center justify-between px-4 py-2.5 bg-slate-900 border-b border-slate-700">
  <div>
    <h1 class="text-[15px] font-semibold tracking-wide m-0">Dispatcher — layout idea</h1>
    <div class="text-slate-400 text-xs">click a state below to preview it — this is a clickable wireframe, not final UI</div>
  </div>
  <div class="flex gap-1.5 flex-wrap" id="statePicker"></div>
</div>

<div class="grid grid-cols-[250px_1fr_280px] h-[calc(100vh-49px)]">

  <!-- LEFT: lists -->
  <div class="bg-slate-900 border-r border-slate-700 overflow-y-auto">
    <div class="flex border-b border-slate-700" id="tabs">
      <button data-tab="drivers" class="tab-btn flex-1 py-2.5 px-1 text-[11px] text-slate-100 border-b-2 border-sky-400 cursor-pointer bg-transparent">Drivers <span class="bg-slate-800 rounded-full px-1.5 text-[10px] text-slate-400">3</span></button>
      <button data-tab="trips" class="tab-btn flex-1 py-2.5 px-1 text-[11px] text-slate-400 border-b-2 border-transparent cursor-pointer bg-transparent">Trips <span class="bg-slate-800 rounded-full px-1.5 text-[10px] text-slate-400">2</span></button>
      <button data-tab="ongoing" class="tab-btn flex-1 py-2.5 px-1 text-[11px] text-slate-400 border-b-2 border-transparent cursor-pointer bg-transparent">Ongoing <span class="bg-slate-800 rounded-full px-1.5 text-[10px] text-slate-400">1</span></button>
      <button data-tab="invited" class="tab-btn flex-1 py-2.5 px-1 text-[11px] text-slate-400 border-b-2 border-transparent cursor-pointer bg-transparent">Invited <span class="bg-slate-800 rounded-full px-1.5 text-[10px] text-slate-400">1</span></button>
    </div>
    <div class="p-2" id="listArea"></div>
  </div>

  <!-- CENTER: map -->
  <div class="relative bg-slate-950 overflow-hidden">
    <div class="map-grid absolute inset-0" id="mapArea">
      <div class="absolute top-3.5 left-3.5 right-3.5 flex gap-2 z-10">
        <input id="searchInput" placeholder="Search a trip by name or pickup…"
          class="flex-1 bg-slate-900 border border-slate-700 text-slate-100 px-3 py-2 rounded-lg text-[13px] placeholder:text-slate-500 outline-none focus:border-sky-400">
        <button id="searchBtn" class="bg-sky-400 text-slate-950 font-semibold px-3.5 py-2 rounded-lg text-[13px] cursor-pointer">Search</button>
      </div>

      <div class="absolute bottom-3.5 left-3.5 bg-slate-900/90 border border-slate-700 rounded-lg px-2.5 py-2 text-[11px] text-slate-400 flex gap-3 z-10">
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span>Available driver</span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span>Busy driver</span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-purple-400 inline-block"></span>Invited driver</span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-sky-400 inline-block"></span>Trip pin</span>
      </div>
      <!-- pins injected by JS -->
    </div>
  </div>

  <!-- RIGHT: details -->
  <div class="bg-slate-900 border-l border-slate-700 overflow-y-auto" id="rightPanel">
    <div class="p-8 text-slate-400 text-xs text-center leading-relaxed">Nothing selected yet.<br>Click a driver or a trip — from the list or the map — to see details here.</div>
  </div>
</div>

<script>
/* ---------- fake data ---------- */
const drivers = [
  {id:'d1', name:'Omar Hassan', status:'free', car:'Toyota Corolla · 2019', plate:'ع ب د 1234', rating:4.8, x:'28%', y:'40%', phone:'+20 100 111 2222', lastTrip:'12 min ago'},
  {id:'d2', name:'Mostafa Adel', status:'free', car:'Hyundai Elantra · 2021', plate:'ط س ن 5567', rating:4.6, x:'55%', y:'62%', phone:'+20 111 222 3333', lastTrip:'40 min ago'},
  {id:'d3', name:'Karim Youssef', status:'busy', car:'Kia Cerato · 2020', plate:'س ي د 8842', rating:4.9, x:'70%', y:'30%', phone:'+20 122 333 4444', lastTrip:'on trip now'},
];
const invitedDrivers = [
  {id:'i1', name:'Sherif Nabil', status:'invited', car:'Chevrolet Optra · 2018', plate:'ن ص ر 9012', rating:4.5, x:'40%', y:'22%', phone:'+20 155 444 5555', invitedFor:'Trip #T-1042', sentAgo:'2 min ago'},
];
const trips = [
  {id:'t1', name:'Trip #T-1042', status:'available', pickup:'Maadi, Corniche St.', dropoff:'Nasr City, Abbas El Akkad', rider:'Nourhan S.', fare:'120 EGP', dist:'14.2 km', x:'46%', y:'34%'},
  {id:'t2', name:'Trip #T-1043', status:'available', pickup:'Dokki, Tahrir St.', dropoff:'6th of October City', rider:'Ahmed R.', fare:'210 EGP', dist:'32 km', x:'20%', y:'70%'},
];
const ongoingTrips = [
  {id:'o1', name:'Trip #T-1039', status:'ongoing', pickup:'Zamalek', dropoff:'Heliopolis', rider:'Laila K.', fare:'95 EGP', dist:'11 km', driver:'Karim Youssef', x:'70%', y:'30%', eta:'8 min to drop-off'},
];

let state = { tab:'drivers', selectedType:null, selectedId:null, searchMode:false, searchedTrip:null };

/* ---------- state picker ---------- */
const presets = [
  {key:'browse', label:'1. Browsing lists'},
  {key:'driverClick', label:'2. Driver clicked'},
  {key:'tripClick', label:'3. Trip clicked'},
  {key:'searchRings', label:'4. Search → radius rings'},
  {key:'invited', label:'5. Invited driver'},
  {key:'ongoing', label:'6. Ongoing trip'},
];
const pickerEl = document.getElementById('statePicker');
const activeClasses = ['bg-sky-400','text-slate-950','border-sky-400','font-semibold'];
const idleClasses = ['bg-slate-800','text-slate-400','border-slate-700'];

presets.forEach(p=>{
  const b=document.createElement('button');
  b.textContent=p.label;
  b.dataset.key=p.key;
  b.className='border rounded-md px-2.5 py-1.5 text-xs cursor-pointer '+idleClasses.join(' ');
  b.onclick=()=>applyPreset(p.key);
  pickerEl.appendChild(b);
});

function setActivePreset(key){
  [...pickerEl.children].forEach(b=>{
    const isActive = b.dataset.key===key;
    b.classList.remove(...activeClasses,...idleClasses);
    b.classList.add(...(isActive?activeClasses:idleClasses));
  });
}

function applyPreset(key){
  setActivePreset(key);
  state.searchMode=false; state.searchedTrip=null;
  document.getElementById('searchInput').value='';
  if(key==='browse'){ state.tab='drivers'; state.selectedType=null; state.selectedId=null; }
  if(key==='driverClick'){ state.tab='drivers'; state.selectedType='driver'; state.selectedId='d1'; }
  if(key==='tripClick'){ state.tab='trips'; state.selectedType='trip'; state.selectedId='t1'; }
  if(key==='searchRings'){ state.tab='trips'; state.selectedType='trip'; state.selectedId='t2'; state.searchMode=true; state.searchedTrip='t2'; document.getElementById('searchInput').value='Trip #T-1043'; }
  if(key==='invited'){ state.tab='invited'; state.selectedType='driver'; state.selectedId='i1'; }
  if(key==='ongoing'){ state.tab='ongoing'; state.selectedType='trip'; state.selectedId='o1'; }
  render();
}

/* ---------- tabs ---------- */
document.getElementById('tabs').addEventListener('click', e=>{
  const btn=e.target.closest('button');
  if(!btn) return;
  state.tab=btn.dataset.tab;
  setActivePreset(null);
  render();
});

/* ---------- search ---------- */
document.getElementById('searchBtn').addEventListener('click', ()=>{
  const val=document.getElementById('searchInput').value.trim().toLowerCase();
  const all=[...trips, ...ongoingTrips];
  const found = all.find(t=>t.name.toLowerCase().includes(val));
  if(found){
    state.searchMode=true; state.searchedTrip=found.id;
    state.selectedType='trip'; state.selectedId=found.id;
  } else {
    state.searchMode=false; state.searchedTrip=null;
  }
  setActivePreset(null);
  render();
});

/* ---------- render list ---------- */
function renderList(){
  const area=document.getElementById('listArea');
  area.innerHTML='';
  [...document.querySelectorAll('#tabs button')].forEach(b=>{
    const isActive = b.dataset.tab===state.tab;
    b.classList.toggle('text-slate-100', isActive);
    b.classList.toggle('text-slate-400', !isActive);
    b.classList.toggle('border-sky-400', isActive);
    b.classList.toggle('border-transparent', !isActive);
  });

  let items=[], type='driver';
  if(state.tab==='drivers'){ items=drivers; type='driver'; }
  if(state.tab==='trips'){ items=trips; type='trip'; }
  if(state.tab==='ongoing'){ items=ongoingTrips; type='trip'; }
  if(state.tab==='invited'){ items=invitedDrivers; type='driver'; }

  const dotColor = it => it.status==='free' ? 'bg-emerald-400'
    : it.status==='busy' ? 'bg-amber-400'
    : it.status==='invited' ? 'bg-purple-400'
    : it.status==='ongoing' ? 'bg-amber-400'
    : 'bg-sky-400';

  items.forEach(it=>{
    const row=document.createElement('div');
    const selected = state.selectedId===it.id;
    row.className = 'flex items-center gap-2.5 px-2 py-2.5 rounded-md cursor-pointer mb-1 hover:bg-slate-800 '
      + (selected ? 'bg-slate-800 outline outline-1 outline-sky-400' : '');
    row.innerHTML=`
      <span class="w-2.5 h-2.5 rounded-full ${dotColor(it)} flex-shrink-0"></span>
      <div>
        <div class="font-semibold text-[13px]">${it.name}</div>
        <div class="text-slate-400 text-[11px]">${type==='driver' ? (it.car||'') : (it.pickup+' → '+it.dropoff)}</div>
      </div>`;
    row.onclick=()=>{ state.selectedType=type; state.selectedId=it.id; setActivePreset(null); render(); };
    area.appendChild(row);
  });
}

/* ---------- render map ---------- */
function renderMap(){
  const map=document.getElementById('mapArea');
  [...map.querySelectorAll('.map-pin, .map-ring, .map-ring-label')].forEach(n=>n.remove());

  const allDrivers=[...drivers, ...invitedDrivers];
  allDrivers.forEach(d=>{
    const pin=document.createElement('div');
    pin.className='map-pin absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer z-[3]';
    pin.style.left=d.x; pin.style.top=d.y;
    const cls = d.status==='busy'?'busy': d.status==='invited'?'invited':'';
    pin.innerHTML=`<div class="pin-driver ${cls}"></div>
      <div class="absolute top-full left-1/2 -translate-x-1/2 mt-0.5 whitespace-nowrap text-[10px] text-slate-400 bg-slate-950/80 px-1.5 rounded">${d.name.split(' ')[0]}</div>`;
    pin.onclick=()=>{ state.selectedType='driver'; state.selectedId=d.id; setActivePreset(null); render(); };
    map.appendChild(pin);
  });

  const allTrips=[...trips, ...ongoingTrips];
  allTrips.forEach(t=>{
    const pin=document.createElement('div');
    pin.className='map-pin absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer z-[3]';
    pin.style.left=t.x; pin.style.top=t.y;
    const focused = state.searchMode && state.searchedTrip===t.id;
    pin.innerHTML=`<div class="pin-trip ${focused?'focused':''}"></div>
      <div class="absolute top-full left-1/2 -translate-x-1/2 mt-0.5 whitespace-nowrap text-[10px] text-slate-400 bg-slate-950/80 px-1.5 rounded">${t.name}</div>`;
    pin.onclick=()=>{ state.selectedType='trip'; state.selectedId=t.id; setActivePreset(null); render(); };
    map.appendChild(pin);

    if(focused){
      const radii=[70,140,210]; // px standing in for 10 / 20 / 30 km
      radii.forEach((r,i)=>{
        const ring=document.createElement('div');
        ring.className='map-ring ring absolute z-[1]';
        ring.style.left=t.x; ring.style.top=t.y;
        ring.style.width=r*2+'px'; ring.style.height=r*2+'px';
        map.appendChild(ring);

        const lbl=document.createElement('div');
        lbl.className='map-ring-label absolute text-sky-400 text-[10px] bg-slate-950/85 px-1.5 rounded -translate-x-1/2 -translate-y-1/2 z-[2]';
        lbl.textContent=(10*(i+1))+' km';
        lbl.style.left=t.x;
        lbl.style.top=`calc(${t.y} - ${r}px)`;
        map.appendChild(lbl);
      });
    }
  });
}

/* ---------- render right panel ---------- */
function findById(id){ return [...drivers, ...invitedDrivers, ...trips, ...ongoingTrips].find(x=>x.id===id); }

function renderRight(){
  const panel=document.getElementById('rightPanel');
  if(!state.selectedId){
    panel.innerHTML=`<div class="p-8 text-slate-400 text-xs text-center leading-relaxed">Nothing selected yet.<br>Click a driver or a trip — from the list or the map — to see details here.</div>`;
    return;
  }
  const it=findById(state.selectedId);
  if(!it){ panel.innerHTML=`<div class="p-8 text-slate-400 text-xs text-center">Not found.</div>`; return; }

  const badge = (text, colorClasses) => `<span class="inline-block text-[10px] px-2 py-0.5 rounded-full mt-1.5 font-semibold ${colorClasses}">${text}</span>`;
  const field = (k,v) => `<div class="mb-3"><div class="text-slate-400 text-[11px] uppercase tracking-wide">${k}</div><div class="text-[13.5px] mt-0.5">${v}</div></div>`;
  const btn = (text, primary) => `<button class="flex-1 min-w-[100px] py-2 rounded-md text-xs cursor-pointer border ${primary ? 'bg-sky-400 text-slate-950 border-sky-400 font-semibold' : 'bg-slate-800 border-slate-700 text-slate-100'}">${text}</button>`;
  const note = html => `<div class="m-3.5 p-2.5 bg-slate-800 border border-dashed border-slate-700 rounded-lg text-[11.5px] text-slate-400 leading-relaxed">${html}</div>`;

  if(state.selectedType==='driver'){
    const badgeMap = {
      free:['Available','bg-emerald-400/15 text-emerald-400'],
      busy:['On a trip','bg-amber-400/15 text-amber-400'],
      invited:['Invite sent','bg-purple-400/15 text-purple-400'],
    };
    const [badgeText, badgeColor] = badgeMap[it.status];
    panel.innerHTML=`
      <div class="p-3.5 border-b border-slate-700">
        <div class="text-base font-bold">${it.name}</div>
        ${badge(badgeText, badgeColor)}
      </div>
      <div class="p-3.5">
        ${field('Vehicle', it.car)}
        ${field('Plate', it.plate)}
        ${field('Rating', '★ '+it.rating)}
        ${field('Phone', it.phone)}
        ${it.invitedFor ? field('Invited for', it.invitedFor+' · sent '+it.sentAgo) : field('Last activity', it.lastTrip)}
      </div>
      <div class="flex gap-2 flex-wrap px-3.5 pb-3.5">
        ${it.status==='free' ? btn('Assign to trip',true)+btn('Call',false) : ''}
        ${it.status==='invited' ? btn('Resend invite',true)+btn('Cancel invite',false) : ''}
        ${it.status==='busy' ? btn('View current trip',false)+btn('Call',false) : ''}
      </div>
      ${note('<b class="text-slate-100">Idea:</b> this panel reuses the same layout for every driver — only the badge color and action buttons change depending on status (free / busy / invited).')}
    `;
  } else {
    const isOngoing = it.status==='ongoing';
    panel.innerHTML=`
      <div class="p-3.5 border-b border-slate-700">
        <div class="text-base font-bold">${it.name}</div>
        ${badge(isOngoing?'Ongoing':'Awaiting driver', isOngoing?'bg-amber-400/15 text-amber-400':'bg-sky-400/15 text-sky-400')}
      </div>
      <div class="p-3.5">
        ${field('Rider', it.rider)}
        ${field('Pickup', it.pickup)}
        ${field('Drop-off', it.dropoff)}
        ${field('Distance / Fare', it.dist+' · '+it.fare)}
        ${it.driver ? field('Driver', it.driver) : ''}
        ${it.eta ? field('ETA', it.eta) : ''}
      </div>
      <div class="flex gap-2 flex-wrap px-3.5 pb-3.5">
        ${!isOngoing ? btn('Search nearby drivers',true)+btn('Invite driver',false) : btn('Track live',false)+btn('Contact rider',false)}
      </div>
      ${state.searchMode && state.searchedTrip===it.id ? note('<b class="text-slate-100">Idea:</b> hitting search focuses the map on this pin and draws 3 dashed rings at 10 / 20 / 30 km, so you can see which drivers fall inside each radius before inviting one.') : ''}
    `;
  }
}

function render(){ renderList(); renderMap(); renderRight(); }
applyPreset('browse');
</script>
</body>
</html>
